name: Generate Snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: FallinTanishq
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00f5ff&color_dots=0d1117,7b2ff7,bd00ff,00f5ff,ffffff
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
